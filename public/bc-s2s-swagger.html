<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPNR Internal — BC S2S API Docs</title>
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      #swagger-ui { height: 100%; }
      #auth-warning {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px 16px;
        background: #fff3cd;
        border-bottom: 1px solid #ffe69c;
        color: #664d03;
        font-size: 14px;
      }
      #auth-warning code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <p id="auth-warning">
      Internal only. If the spec fails to load below, you are not logged in — call
      <code>POST /api/internal-auth/login</code> first, then reload this page. Browser
      "Try it out" cannot sign requests in production; this page is a contract reference.
    </p>
    <div id="swagger-ui"></div>
    <script src="/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="/swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/api/docs/bc-s2s/v1/openapi",
        dom_id: "#swagger-ui",
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        displayRequestDuration: true,
      });
    </script>
  </body>
</html>
