name: Guard audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  guard-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Guard audit
        run: yarn test:guard-audit
